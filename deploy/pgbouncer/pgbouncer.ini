; ==============================================================================
; SWAT / WAKE Production PgBouncer Configuration
; Optimized for multi-tenant high-throughput transaction pooling
; ==============================================================================

[databases]
; Format: dbname = host=... port=... dbname=...
; In Docker networks, use host=postgres; on localhost, use host=127.0.0.1
swat = host=postgres port=5432 auth_user=swat dbname=swat

[pgbouncer]
; Networking
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = swat

; Pooling Mode: transaction mode is essential for multi-tenant microservices
; (node-postgres connection pool multiplexed across a small set of backend connections)
pool_mode = transaction

; Connection Limits
max_client_conn = 2000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 50

; Timeouts & Lifetimes
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 60
idle_transaction_timeout = 60
client_idle_timeout = 0

; Low-level TCP keep-alive (prevents dead TCP connections through firewalls/load balancers)
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 30
tcp_keepintvl = 10

; Application Compatibility (Critical for Node.js pg client)
ignore_startup_parameters = extra_float_digits,search_path,timezone

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
