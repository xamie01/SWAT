services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # pg_stat_statements is a shared library, so it must be preloaded at server
    # start; CREATE EXTENSION alone (migration 037) is not enough.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swat}
      POSTGRES_USER: ${POSTGRES_USER:-swat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swat} -d ${POSTGRES_DB:-swat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.0
    restart: unless-stopped
    ports:
      - "${PGBOUNCER_BIND_HOST:-127.0.0.1}:${PGBOUNCER_PORT:-6432}:6432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-swat}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-swat}
      DB_NAME: ${POSTGRES_DB:-swat}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 50
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path,timezone
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
