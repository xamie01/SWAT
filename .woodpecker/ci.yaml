when:
  - event: [push, pull_request, manual]

# Default CI is credential-free static verification only. No DB/Redis containers,
# developer .env copying, migrations, network acquisition or broad test imports.
# Mutable tags below are NOT approved production/build runtime identities.
steps:
  - name: ops-static
    image: python:3.11-slim
    commands:
      - taskset -c 0 flock -x /tmp/swat-package11-checks.lock python3 -I -S deploy/tests/ops_static_test.py
      - taskset -c 0 flock -x /tmp/swat-package11-checks.lock python3 -I -S deploy/tools/ops-readiness.py --verify-only > ops-input-inventory.json

  - name: candidate-build
    image: python:3.11-slim
    depends_on: [ops-static]
    when:
      - event: manual
        # Disabled until this is an approved immutable image containing exact
        # Node22/pnpm10.2.0, util-linux and the complete offline dependency tree.
        evaluate: 'false'
    environment:
      NODE_ENV: test
      TRADING_MODE: paper
      AUTO_EXECUTE: 'false'
      LIVE_ENABLED_CHAINS: ''
    commands:
      - test "$(pnpm --version)" = 10.2.0
      - taskset -c 0 flock -x /tmp/swat-package11-checks.lock env NODE_OPTIONS=--max-old-space-size=512 pnpm check:secrets
      - taskset -c 0 flock -x /tmp/swat-package11-checks.lock env NODE_OPTIONS=--max-old-space-size=512 pnpm check:env
      # Emit dependencies before checking consumers; never root turbo build/test.
      - taskset -c 0 flock -x /tmp/swat-package11-checks.lock env NODE_OPTIONS=--max-old-space-size=640 pnpm --filter @swat/shared build
      - taskset -c 0 flock -x /tmp/swat-package11-checks.lock env NODE_OPTIONS=--max-old-space-size=640 pnpm --filter @swat/db build
      - for app in api indexer signal-engine trade-executor scorer discovery alert-service lp; do taskset -c 0 flock -x /tmp/swat-package11-checks.lock env NODE_OPTIONS=--max-old-space-size=640 pnpm --filter "@swat/$app" build || exit; done
      - for pkg in shared db api indexer signal-engine trade-executor scorer discovery alert-service lp web; do taskset -c 0 flock -x /tmp/swat-package11-checks.lock env NODE_OPTIONS=--max-old-space-size=640 pnpm --filter "@swat/$pkg" typecheck || exit; done
      - taskset -c 0 flock -x /tmp/swat-package11-checks.lock env NODE_OPTIONS=--max-old-space-size=640 pnpm typecheck:tools
      - taskset -c 0 flock -x /tmp/swat-package11-checks.lock env NODE_OPTIONS=--max-old-space-size=640 pnpm exec tsc --noEmit -p tsconfig.integration.json
      - taskset -c 0 flock -x /tmp/swat-package11-checks.lock python3 -I -S deploy/tools/ops-readiness.py --verify-only > ops-build-input-inventory.json
      # Not a deployable build: separate reviewed literal-file regressions,
      # isolated migration twice/staging-copy replay, fresh Next/native builds,
      # runtime dependency closure and signed build evidence remain gates.

  - name: acquire-deploy-artifacts
    image: python:3.11-slim
    depends_on: [candidate-build]
    when:
      - event: manual
        evaluate: 'false'
    commands:
      - env -i PATH=/usr/local/bin:/usr/bin:/bin python3 -I -S deploy/tools/package27-deploy-artifacts.py acquire

  - name: deploy-vercel
    image: python:3.11-slim
    depends_on: [acquire-deploy-artifacts]
    when:
      - event: manual
        evaluate: 'false'
    # No from_secret references in pending source. A future manual approval must
    # separately review immutable image, lock, isolation and minimal secret scope.
    commands:
      - python3 -I -S deploy/tools/package27-deploy-artifacts.py publish
