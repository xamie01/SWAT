when:
  - event: [push, pull_request, manual]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: swat_integration
      POSTGRES_USER: swat
      POSTGRES_PASSWORD: swat
    ports:
      - 5432

  redis:
    image: redis:7-alpine
    ports:
      - 6379

steps:
  - name: prepare
    image: node:22-slim
    commands:
      - corepack enable
      - corepack prepare pnpm@10.2.0 --activate
      - pnpm install --frozen-lockfile
      - cp .env.example .env
      - sed -i "s|localhost:5432|postgres:5432|g" .env
      - sed -i "s|127.0.0.1:5432|postgres:5432|g" .env
      - sed -i "s|localhost:6379|redis:6379|g" .env
      - sed -i "s|127.0.0.1:6379|redis:6379|g" .env
      - sed -i "s|:5432/swat|:5432/swat_integration|g" .env
      - sed -i "s|POSTGRES_DB=swat|POSTGRES_DB=swat_integration|g" .env
      - echo "INTEGRATION_DATABASE_URL=postgresql://swat:swat@postgres:5432/swat_integration" >> .env
      - pnpm check:secrets
      - pnpm check:env

  - name: verify
    image: node:22-slim
    environment:
      DATABASE_URL: postgresql://swat:swat@postgres:5432/swat_integration
      INTEGRATION_DATABASE_URL: postgresql://swat:swat@postgres:5432/swat_integration
      REDIS_URL: redis://redis:6379
    commands:
      - corepack enable
      - corepack prepare pnpm@10.2.0 --activate
      - pnpm db:migrate
      - pnpm typecheck

  - name: test
    image: node:22-slim
    environment:
      DATABASE_URL: postgresql://swat:swat@postgres:5432/swat_integration
      INTEGRATION_DATABASE_URL: postgresql://swat:swat@postgres:5432/swat_integration
      REDIS_URL: redis://redis:6379
      TRADING_MODE: paper
      AUTO_EXECUTE: "false"
      API_KEY: swat-ci-key
      NEXT_PUBLIC_API_KEY: swat-ci-key
    commands:
      - corepack enable
      - corepack prepare pnpm@10.2.0 --activate
      - pnpm test
      - pnpm build
      - pnpm test:integration
