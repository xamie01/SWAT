<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAKE PDA Preview — Read Only</title>
  <style>
    body { font: 1rem system-ui; max-width: 50rem; margin: 3rem auto; padding: 1rem; color: #e2e8f0; background: #111827; }
    input, button { padding: .75rem; margin: .5rem 0; } input { width: 90%; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
  <script src="/preview.js" defer></script>
</head>
<body>
  <h1>Solana PDA address preview</h1>
  <p>Read-only mathematical derivation. This is not proof of a deployed vault or an authorization check.</p>
  <p><strong>Do not fund this address.</strong> Funding, signing, withdrawal and RPC simulations are disabled. No wallet connection or private key is required.</p>
  <label for="owner">Owner public key</label>
  <input id="owner" autocomplete="off" spellcheck="false">
  <button id="preview" type="button">Preview PDA</button>
  <pre id="result" role="status"></pre>
</body>
</html>
