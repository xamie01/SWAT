[workspace]
members = [
    ".",
    "trident-tests/fuzz_0",
]
resolver = "2"

[package]
name = "wake-vault"
version = "0.1.0"
description = "WAKE non-custodial execution vault for Solana (ADR-0004, S4-P12, S4-P19)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "wake_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "=1.18.26"
